<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>SimSim Friends 데모 영상</title>
    <link rel="stylesheet" href="./demo-video.css" />
  </head>
  <body>
    <!--
      랜딩 히어로의 데모 영상을 찍는 장면. `scripts/make-demo-video.js` 가 띄워 한 장씩
      넘기며 캡처한다. 배포본에는 들어가지 않는다.
    -->
    <div id="scene">
      <section class="screen mine">
        <header class="bar"><span class="who" data-text="mine"></span><span class="icons"><i></i><i></i><i></i></span></header>
        <canvas class="stage"></canvas>
        <div class="bubble" data-text="bubble"></div>
        <div class="ripple"></div>
      </section>

      <section class="screen theirs">
        <header class="bar"><span class="who" data-text="theirs"></span><span class="icons"><i></i><i></i><i></i></span></header>
        <canvas class="stage"></canvas>
        <div class="landing-ring"></div>
        <div class="nameplate" data-text="sender"></div>
      </section>

      <svg class="flight" viewBox="0 0 640 440" aria-hidden="true">
        <defs>
          <linearGradient id="trail-fade" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffc83d" stop-opacity="0" />
            <stop offset="1" stop-color="#ffc83d" stop-opacity="0.9" />
          </linearGradient>
        </defs>
        <path class="trail" d="" />
        <circle class="glow" r="14" />
        <circle class="dot" r="7" />
      </svg>

      <svg class="cursor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 2.5v17.2l4.3-4.1 2.8 6.4 3-1.3-2.8-6.3 6-.2z" />
      </svg>
    </div>
    <script type="module" src="./demo-video.ts"></script>
  </body>
</html>
