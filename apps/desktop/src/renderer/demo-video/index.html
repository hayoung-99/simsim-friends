<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>SimSim Friends 데모 영상</title>
    <link rel="stylesheet" href="./demo-video.css" />
  </head>
  <body>
    <!--
      랜딩 히어로의 데모 영상을 찍는 장면. `scripts/make-demo-video.js` 가 띄워 한 장씩
      넘기며 캡처한다. 배포본에는 들어가지 않는다.

      바탕화면 두 장(내 것 · 친구 것)이 옆으로 붙어 있고, 둘 다 같은 소품을 갖는다 —
      누를 때의 말풍선과 물결, 신호가 닿을 때의 고리와 이름표. 왕복이라 양쪽 모두 누르기도
      하고 받기도 한다.
    -->
    <div id="scene">
      <!-- 카메라가 움직이는 것은 이 안쪽이다. 커서는 카메라를 따라 커지지 않게 밖에 둔다 -->
      <div id="world">
        <section class="screen mine">
          <div class="wallpaper"></div>
          <ul class="desk-icons"></ul>
          <header class="bar">
            <span class="menus"><i></i><i></i><i></i></span>
            <span class="tray"><i class="tray-app"></i><b class="clock">10:24</b></span>
          </header>
          <nav class="dock" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></nav>
          <canvas class="stage"></canvas>
          <div class="bubble"></div>
          <div class="ripple"></div>
          <div class="landing-ring"></div>
          <div class="nameplate"></div>
        </section>

        <section class="screen theirs">
          <div class="wallpaper"></div>
          <ul class="desk-icons"></ul>
          <header class="bar">
            <span class="menus"><i></i><i></i><i></i></span>
            <span class="tray"><i class="tray-app"></i><b class="clock">10:24</b></span>
          </header>
          <nav class="dock" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></nav>
          <canvas class="stage"></canvas>
          <div class="bubble"></div>
          <div class="ripple"></div>
          <div class="landing-ring"></div>
          <div class="nameplate"></div>
        </section>

        <svg class="flight" viewBox="0 0 1304 440" aria-hidden="true">
          <defs>
            <linearGradient id="trail-fade" gradientUnits="userSpaceOnUse">
              <!-- 신호 색. `demo-video.css` 의 `--signal` 과 같다 -->
              <stop offset="0" stop-color="#f08a1c" stop-opacity="0" />
              <stop offset="1" stop-color="#f08a1c" stop-opacity="0.9" />
            </linearGradient>
          </defs>
          <path class="trail" d="" />
          <circle class="pulse" r="0" />
          <circle class="pulse" r="0" />
          <circle class="dot" r="0" />
        </svg>
      </div>

      <svg class="cursor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 2.5v17.2l4.3-4.1 2.8 6.4 3-1.3-2.8-6.3 6-.2z" />
      </svg>
    </div>
    <script type="module" src="./demo-video.ts"></script>
  </body>
</html>
